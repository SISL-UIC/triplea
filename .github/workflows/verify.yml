name: Verify
jobs:
  build:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 25
    - name: Run Build Checks
      run: ./verify --exclude-task spotlessApply
    timeout-minutes: 6
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
  pull_request: null
  push:
    branches:
    - main
